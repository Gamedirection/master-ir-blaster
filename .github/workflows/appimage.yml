name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0-dev \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            fuse \
            imagemagick

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assemble AppDir
        if: runner.os == 'Linux'
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp "target/${{ matrix.target }}/release/ir-blaster" "$APPDIR/usr/bin/"
          mkdir -p "$APPDIR/usr/share/applications"
          cp packaging/ir-blaster.desktop "$APPDIR/usr/share/applications/"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          # linuxdeploy only accepts icons at specific standard resolutions;
          # the source asset (250x250) isn't one of them.
          convert img/fc_bk.png -resize 256x256 icon-256.png
          cp icon-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/ir-blaster.png"

      - name: Download linuxdeploy and appimagetool
        if: runner.os == 'Linux'
        run: |
          wget -q -O linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage"
          chmod +x linuxdeploy.AppImage
          wget -q -O appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        if: runner.os == 'Linux'
        env:
          # GitHub Actions runners have no FUSE-mounted filesystem for AppImages
          # to mount themselves from; this makes them extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: IR-Blaster-${{ matrix.arch }}.AppImage
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/ir-blaster \
            --desktop-file packaging/ir-blaster.desktop \
            --icon-file icon-256.png \
            --output appimage

      - name: Upload AppImage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: IR-Blaster-${{ matrix.arch }}-AppImage
          path: "IR-Blaster-*.AppImage"

      # No installer yet (see docs/cross-platform-packaging-plan.md) - a
      # portable zip is the simplest thing that's actually been verified to
      # work (this exact build was cross-compiled and run-checked locally
      # via mingw before ever touching CI). An MSI via cargo-wix is a
      # follow-up once there's a real Windows CI run to validate it against.
      - name: Package portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "IR-Blaster-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/ir-blaster.exe" "$dest/IR-Blaster.exe"
          Copy-Item "packaging/windows/README-first.txt" "$dest/README-first.txt"
          Compress-Archive -Path "$dest/*" -DestinationPath "IR-Blaster-windows-${{ matrix.arch }}.zip"

      - name: Upload Windows zip artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: IR-Blaster-windows-${{ matrix.arch }}-zip
          path: "IR-Blaster-windows-*.zip"

      - name: Build .icns and assemble .app bundle
        if: runner.os == 'macOS'
        run: |
          set -e
          APP="IR Blaster.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/ir-blaster" "$APP/Contents/MacOS/ir-blaster"

          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d '"' -f2)
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"

          # iconutil only accepts specific named sizes in an .iconset dir;
          # the source asset (250x250) gets scaled to each (upscaled past
          # 256px, so the largest sizes will look soft - a known limitation
          # of the current source art, not a packaging bug). Using sips
          # (built into macOS) instead of ImageMagick, which isn't
          # preinstalled on the GitHub-hosted macOS runner.
          mkdir -p AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size img/fc_bk.png --out "AppIcon.iconset/icon_${size}x${size}.png" > /dev/null
            double=$((size * 2))
            sips -z $double $double img/fc_bk.png --out "AppIcon.iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"

          mkdir -p dmg-staging
          mv "$APP" dmg-staging/
          cp packaging/macos/README-first.txt dmg-staging/

      - name: Package .dmg
        if: runner.os == 'macOS'
        run: |
          set -e
          hdiutil create -volname "IR Blaster" -srcfolder dmg-staging -fs HFS+ \
            -ov -format UDZO "IR-Blaster-macos-${{ matrix.arch }}.dmg"

      - name: Upload macOS dmg artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: IR-Blaster-macos-${{ matrix.arch }}-dmg
          path: "IR-Blaster-macos-*.dmg"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach build artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/IR-Blaster-*.AppImage
            artifacts/*/IR-Blaster-*.zip
            artifacts/*/IR-Blaster-*.dmg
