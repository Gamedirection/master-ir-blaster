name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libusb-1.0-0-dev \
            pkg-config \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            fuse \
            imagemagick

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp target/release/ir-blaster "$APPDIR/usr/bin/"
          mkdir -p "$APPDIR/usr/share/applications"
          cp packaging/ir-blaster.desktop "$APPDIR/usr/share/applications/"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          # linuxdeploy only accepts icons at specific standard resolutions;
          # the source asset (250x250) isn't one of them.
          convert img/fc_bk.png -resize 256x256 icon-256.png
          cp icon-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/ir-blaster.png"

      - name: Download linuxdeploy and appimagetool
        run: |
          wget -q -O linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          wget -q -O appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          # GitHub Actions runners have no FUSE-mounted filesystem for AppImages
          # to mount themselves from; this makes them extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          OUTPUT: IR-Blaster-x86_64.AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/ir-blaster \
            --desktop-file packaging/ir-blaster.desktop \
            --icon-file icon-256.png \
            --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: IR-Blaster-AppImage
          path: "IR-Blaster-*.AppImage"

      - name: Attach AppImage to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "IR-Blaster-*.AppImage"
