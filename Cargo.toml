[package]
name = "ir-blaster"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2", features = ["json"] }
rumqttc = "0.24"
chrono = "0.4"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "tokio"] }
notify-rust = "4.18.0"
